plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral()
	maven {
		name = "JetBrains IntelliJ Dependencies"
		url = "https://packages.jetbrains.team/maven/p/ij/intellij-dependencies"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minecraftty" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	test {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

tasks.register("verifyTerminalCellWidth", JavaExec) {
	group = "verification"
	description = "Runs fast terminal cell width policy checks without starting Minecraft."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.br0b.minecraftty.client.terminal.TerminalCellWidthVerifier"
}

tasks.register("verifyTerminalImageProtocolFilter", JavaExec) {
	group = "verification"
	description = "Runs fast terminal image protocol suppression checks without starting Minecraft."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.br0b.minecraftty.client.terminal.TerminalImageProtocolFilterVerifier"
}

tasks.register("verifyTerminalInputPrediction", JavaExec) {
	group = "verification"
	description = "Runs fast terminal input prediction checks without starting Minecraft."
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.br0b.minecraftty.client.terminal.TerminalInputPredictionVerifier"
}

tasks.named("check") {
	dependsOn verifyTerminalCellWidth
	dependsOn verifyTerminalImageProtocolFilter
	dependsOn verifyTerminalInputPrediction
}

tasks.named("test", Test) {
	failOnNoDiscoveredTests = false
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation include("org.jetbrains.pty4j:pty4j:${project.pty4j_version}")
	implementation include("org.jetbrains.jediterm:jediterm-core:${project.jediterm_core_version}")
	implementation include("org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_stdlib_version}")
	implementation include("net.java.dev.jna:jna:${project.jna_version}")
	implementation include("net.java.dev.jna:jna-platform:${project.jna_version}")
	implementation include("org.jetbrains:annotations:${project.jetbrains_annotations_version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
